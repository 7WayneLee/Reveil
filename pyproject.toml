[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reveil"
version = "0.1.0"
description = "Mosaic restoration with an LTX-2.5 IC-LoRA: training data tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "av>=12",
    "pyyaml>=6",
]

[project.optional-dependencies]
annotate = ["onnxruntime>=1.18"]  # onnxruntime-gpu instead on a CUDA machine
dev = ["pytest>=8", "onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
reveil-make-pairs = "reveil.make_pairs:main"
reveil-real-pairs = "reveil.real_pairs:main"
reveil-conditions = "reveil.conditions:main"
reveil-annotate = "reveil.annotate:main"
reveil-realmask = "reveil.realmask:main"

[tool.setuptools.packages.find]
include = ["reveil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
